# 插件自动更新配置
# 默认启用；每次启动时检查 GitHub Releases 或 Maven 中心新版本。
update:
  enabled: true

  # 更新源：github 或 maven
  source: github

  # GitHub Releases 参数（source=github 时生效）
  github-owner: addxiaoyi
  github-repo: starmc-website

  # Maven Central 参数（source=maven 时生效）
  maven-group: io.github.addxiaoyi
  maven-artifact: starx-velocity

  # 检查间隔（分钟），最小 30，最大 1440
  check-interval-minutes: 30