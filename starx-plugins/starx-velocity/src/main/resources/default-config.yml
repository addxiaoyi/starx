schema-version: 5

# StarX Velocity 默认配置
# 只需先修改 uworld.auth.target-server；其余项目都有可直接运行的安全默认值。
# 修改后必须完整重启 Velocity，不支持热重载。

# HTTP 管理接口密钥。生产环境必须设置高强度随机值。
# 自动检测运行环境。若某一部分由你手工维护，请关闭对应的 manage 开关。
auto-config:
  enabled: true
  generate-api-key: true
  manage-optional-integrations: true
  manage-texture-source: true
  select-auth-target: true
  # 报告只包含平台、插件和服务器元数据，绝不会写入任何密钥。
  report-file: "auto-detection.json"

# HTTP 管理接口密钥。留空时会自动生成 384 位随机密钥。
api-key: ""

# 运行环境与外部集成兼容性检查。UNKNOWN/DEGRADED 只会告警并继续启动；
# 当 strict-platform 为 true 时，UNSUPPORTED 会阻止插件启动。
compatibility:
  strict-platform: true
  report-file: "compatibility-report.json"

# 默认只监听本机，避免管理接口直接暴露到公网。
http:
  bind: "127.0.0.1"
  port: 8788
  # strict: 冲突即停止；fallback: 仅在范围内换端口；
  # persist: 优先复用上次端口；ephemeral: 范围耗尽后允许系统临时端口。
  port-conflict-policy: "persist"
  # 有界候选范围，避免在整个 1-65535 空间中无约束漂移。最多 4096 个端口。
  fallback-range-start: 8788
  fallback-range-end: 8888
  # 兼容手工配置。自动 FRP 结果由 network-automation 报告给出。
  frp-public-url: ""

# 类似面板的一键网络配置助手。默认只检测和生成方案，不擅自开放公网端口。
network-automation:
  enabled: true
  report-file: "network-automation.json"
  public-address:
    enabled: true
    # 至少两个不同服务商返回相同地址，才确认外网出口地址。
    minimum-agreement: 2
    timeout-ms: 2500
    endpoints:
      - "https://api64.ipify.org"
      - "https://checkip.amazonaws.com"
      - "https://icanhazip.com"
  frp:
    # off / detect / managed。managed 只允许 remote-port: 0，由 frps 原子分配空闲端口。
    mode: "detect"
    public-host: ""
    public-scheme: "http"
    public-url: ""
    proxy-name: "starx-api"
    local-address: "127.0.0.1"
    # 与 http.port 相同时，会跟随 HTTP API 最终成功绑定的端口。
    local-port: 8788
    remote-port: 0
    frpc-command: "frpc"
    # 留空时只检查运行中的 frpc 参数和有限的常见配置目录，不遍历磁盘。
    # detect 可读取 TOML/YAML/INI；managed 自动应用仅支持可精确校验 includes 的 TOML。
    main-config-file: ""
    # managed 模式写入的 StarX 专属代理片段；主 TOML 必须通过 includes 精确包含它。
    managed-config-file: "frp/starx-api.toml"
    auto-apply: false
  certificate:
    # 免费证书使用 Let's Encrypt。未满足域名、80 端口路由等前置条件时只生成诊断方案。
    enabled: false
    domain: ""
    email: ""
    client: "auto"
    challenge: "http-01"
    staging-first: true
    auto-run: false
    # 已占用时自动选择其他本地端口；变更后公网路由确认会自动失效。
    http01-local-port: 8789
    http01-public-route-confirmed: false
    # 仅在正式证书缺失、损坏或进入该到期窗口时尝试申请/续期。
    renew-before-days: 30

webhook:
  url: ""
  secret: ""

# 将本节点状态和纹理增量同步到 StarMC 网站。
website-sync:
  enabled: false
  site-url: "https://star-web.top"
  node-id: "proxy-1"
  platform: "velocity"
  # 仅首次注册填写；成功后插件会原子清空并写入 node-token。
  bootstrap-token: ""
  # 由插件自动管理。不会出现在日志、Placeholder 或状态命令中。
  node-token: ""
  heartbeat:
    interval-seconds: 15
    connect-timeout-ms: 3000
    request-timeout-ms: 8000
  textures:
    enabled: true
    source: "skinsrestorer"
    manifest-interval-seconds: 300
    batch-size: 500

database:
  # 推荐使用内置 SQLite；无需额外数据库插件。
  type: "sqlite"
  host: ""
  port: 3306
  database: "plugins/starx/data.db"
  username: "starx"
  password: ""
  url: ""
  pool-max-size: 2
  connection-timeout-ms: 30000

uniauth:
  # 可选外部账号服务；关闭时不会发起任何 UniAuth 请求。
  enabled: false
  api-url: "https://api.example.com/uniauth/"
  api-key: ""
  timeout-ms: 5000
  bridge-mode: false

# 离线模式玩家默认必须在 Uworld 完成登录或注册。
auth:
  binding-website-url: https://star-web.top
  # 同一账号、同一 IP 最近成功输入密码后的免密时长；设为 0 关闭。
  password-bypass-minutes: 30
  allow-offline-default: false
  # 仅用于识别带前缀的离线用户名，不会绕过密码登录。
  offline-identity:
    prefix: "."
    display-name: "前缀离线账号"
  ux:
    titles-enabled: true
    action-bar-enabled: true
    sounds-enabled: true
    prompt-sound: "minecraft:block.note_block.chime"
    success-sound: "minecraft:entity.player.levelup"
    error-sound: "minecraft:block.note_block.bass"
    # 所有认证提示均从这里读取；修改后完整重启 Velocity 生效。
    messages:
      login-title: "欢迎回来"
      login-subtitle: "请在聊天栏输入密码登录"
      register-title: "欢迎来到 StarMC"
      register-subtitle: "在聊天栏输入密码即可注册"
      totp-title: "二步验证"
      totp-subtitle: "请输入 6 位验证码"
      success-title: "认证成功"
      success-subtitle: "正在进入服务器"
      login-prompt: "请输入密码完成登录。"
      login-action-bar: "直接输入密码即可，聊天内容不会公开"
      register-prompt: "请直接在聊天栏输入你的密码完成注册。"
      register-action-bar: "密码仅用于认证，不会显示在聊天中"
      totp-prompt: "请输入验证器的 6 位验证码，或 10 位恢复码。"
      totp-action-bar: "验证码提交后将自动验证"
    # 安全登录卡片的固定文案。字段顺序和颜色由插件保证，文字全部可配置。
    card:
      title: "✦ StarMC 安全登录中心 ✦"
      player-prefix: "玩家："
      uuid-prefix: "玩家 UUID："
      account-type-prefix: "账号类型："
      current-ip-prefix: "当前 IP："
      last-ip-prefix: "上次 IP："
      last-login-prefix: "上次登录："
      playtime-prefix: "累计游玩："
      registered-at-prefix: "注册时间："
      target-prefix: "认证目标："
      premium-account: "正版账号"
      offline-account: "离线账号"
      first-login-account: "首次登录"
      new-player-name: "新玩家"
      no-history: "无历史记录"
      registration-premium-account: "正版账号（待注册）"
      registration-offline-account: "离线账号（待注册）"
      registration-history: "首次注册，无历史记录"
      registration-pending-time: "完成注册后生成"
      unknown-value: "未知"
      target-unavailable: "暂不可用"
      login-link-text: "[点击打开 StarX 账号绑定 · 绑定后免密登录]"
      login-link-hover: "打开安全绑定页面（5 分钟内有效）"
      registration-link-text: "[打开 StarX 账号中心 · 注册后可绑定免密登录]"
      registration-link-hover: "先完成游戏内注册，再进行账号绑定"
      hour-unit: "小时"
      minute-unit: "分钟"

# 插件内置玩家列表，无需安装 TAB 或 PlaceholderAPI。
# 文本使用 MiniMessage；可使用下方示例中的 StarX 变量。
player-list:
  refresh-seconds: 5
  header: |-
      <gradient:#38bdf8:#a855f7><bold>StarMC NETWORK</bold></gradient>
      <gray>欢迎，<white>{starx_player}</white> <dark_gray>|</dark_gray> <aqua>{starx_login_source}</aqua></gray>
  footer: |-
      <gray>当前子服 <white>{starx_server}</white> <dark_gray>|</dark_gray> <green>{starx_server_online}</green> 人</gray>
      <gray>全网在线 <aqua>{starx_network_online}</aqua><dark_gray>/</dark_gray><white>{starx_network_max}</white></gray>

modules:
  # 核心认证与 Uworld
  starx.auth:
    enabled: true
  starx.auth.yggdrasil:
    enabled: true
  starx.auth.uniauth:
    enabled: false
  starx.player-list:
    enabled: true
  starx.player-sessions:
    enabled: true
  starx.auth.migration:
    enabled: false
  starx.auth.migration.commands:
    enabled: false
  # 玩家体验与代理工具
  starx.skin-bridge:
    enabled: true
  starx.chat:
    enabled: true
  starx.maintenance:
    enabled: true
  starx.motd:
    enabled: true
  starx.redirect:
    enabled: true
  starx.queue:
    enabled: true
  starx.tutorial:
    enabled: true
  starx.hub:
    enabled: true
  starx.uworld:
    enabled: true
  starx.reconnect:
    enabled: true
  starx.info:
    enabled: true
  starx.forge:
    enabled: true
    debug: false
    # 代理无法远程关闭客户端模组；开启后只在指定纯净服进行允许、告警或拒绝。
    guard-enabled: false
    unknown-action: "WARN"
    vanilla-servers: []
    allowed-client-only-mods: []
    denied-mods: []
  starx.proxytools.raknet:
    enabled: true
    port: 19132
    debug: false
    # true 时未安装 Geyser/Raknetify 会阻止模块启用；默认仅告警。
    require-provider: false
  starx.online:
    enabled: true
  starx.backend-bridge:
    enabled: true
  starx.messaging:
    enabled: true
  starx.welcome:
    enabled: true
  starx.admin:
    enabled: true
  starx.enhanced:
    enabled: true
  starx.proxytools.filecleaner:
    enabled: false
  starx.security.bot:
    enabled: true
  starx.security.crash:
    enabled: true
  starx.security.risk:
    enabled: true
  starx.security.anticheat:
    enabled: true
  starx.security.blossom:
    enabled: false
  starx.security.smart-rate:
    enabled: false
  starx.security.smart-alert:
    enabled: false
  starx.proxytools.smart-queue:
    enabled: false
  # 可选业务连接：只有主动配置并启用后才访问外部服务。
  starx.integrations.qq:
    enabled: false
  starx.integrations.plan:
    enabled: false
  starx.integrations.mapmod:
    enabled: true
    debug: false
    notify-player: false
  starx.integrations.napcat:
    enabled: false
  # 下列增强仅在对应插件已安装时自动激活；未安装不会影响启动。
  starx.integrations.luckperms:
    enabled: true
  starx.integrations.floodgate:
    enabled: true
  starx.integrations.tab:
    enabled: true
  starx.vote:
    enabled: true

napcat:
  # 可选 QQ/NapCat 连接；默认关闭。
  enabled: false
  ws-url: "ws://127.0.0.1:6700"
  http-url: "http://127.0.0.1:3000"
  qq-group-id: 0
  forward-format: "[MC] {player}: {message}"

totp:
  # 仅开放内置 TOTP 功能入口，不会替玩家自动开启。
  # 每个玩家默认关闭，只有本人完成二维码和 6 位验证码确认后才启用。
  enabled: true

uworld:
  # Velocity 内置虚拟世界，不需要外置 LimboAPI。
  enabled: true
  transfer-timeout-seconds: 30
  auth:
    timeout-seconds: 300
    target-server: "lobby"
    world:
      # VOID 会自动生成 11x11 平台；SCHEMATIC/STRUCTURE 使用 file-name。
      dimension: "OVERWORLD"
      spawn-x: 0.5
      spawn-y: 100.0
      spawn-z: 0.5
      spawn-yaw: 0.0
      spawn-pitch: 0.0
      game-mode: "SURVIVAL"
      loader-type: "AUTO"
      file-name: "auth_world.schem"
      offset-x: 0
      offset-y: 0
      offset-z: 0
      view-distance: 4
      simulation-distance: 4
      platform-radius: 5
  diagnostics:
    enabled: false
    timeout-seconds: 120
    platform-radius: 5
