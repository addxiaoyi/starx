name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n 1)"
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run complete release verification
        run: |
          chmod +x gradlew
          ./gradlew clean check :starx-plugins:starx-universal:check --warning-mode all --no-daemon --console=plain --non-interactive

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cp starx-plugins/starx-universal/build/libs/starx-universal.jar "starx-universal-$version.jar"
          sha256sum "starx-universal-$version.jar" > SHA256SUMS

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            starx-universal-${{ steps.version.outputs.version }}.jar
            SHA256SUMS
            **/build/test-results/test/*.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "starx-universal-$version.jar" SHA256SUMS --verify-tag --generate-notes --title "StarX $version"
