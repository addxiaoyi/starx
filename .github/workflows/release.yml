name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify build toolchain matches release requirements
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -version 2>&1 | head -n 1)"
          echo "System Java: $java_version"
          if ! java -version 2>&1 | grep -q '"25'; then
            echo "ERROR: Release builds must run on JDK 25 (bytecode compatibility contract)" >&2
            exit 1
          fi

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n 1)"
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          notes="docs/releases/$version.md"
          test -s "$notes"
          grep -Fq "# StarX $version" "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Run complete release verification
        run: |
          chmod +x gradlew
          ./gradlew clean check :starx-plugins:starx-universal:check --warning-mode all --no-daemon --console=plain --non-interactive

      - name: Verify universal JAR bytecode targets Java 21 and loads under JDK 21
        shell: bash
        run: |
          set -euo pipefail
          jar="starx-plugins/starx-universal/build/libs/starx-universal.jar"
          test -s "$jar"
          # Extract a representative class and confirm major version 65 (Java 21)
          unzip -p "$jar" io/github/addxiaoyi/starx/velocity/StarxVelocityPlugin.class \
            | od -An -tu1 -N8 | awk '{if ($8 != 65) { print "ERROR: bytecode major version is not 65 (Java 21): " $8; exit 1 } else { print "Bytecode target OK (major 65 / Java 21)" }}'

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="starx-universal-$VERSION.jar"
          cp starx-plugins/starx-universal/build/libs/starx-universal.jar "$artifact"
          sha256sum "$artifact" > SHA256SUMS
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          artifact = Path(f"starx-universal-{version}.jar")
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          manifest = {
              "schemaVersion": 1,
              "version": version,
              "tag": os.environ["TAG"],
              "commit": os.environ["COMMIT"],
              "artifact": artifact.name,
              "sha256": digest,
              "sizeBytes": artifact.stat().st_size,
              "java": 21,
              "bytecodeJava": 21,
              "buildJava": 25,
              "runtimeJava": [21, 25],
              "certifiedPaperApis": [
                  "26.1.2.build.71-stable",
                  "26.2.build.84-stable",
              ],
              "platforms": ["Velocity", "Paper", "Folia"],
              "extensionApi": "1.0.0",
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          grep -Fq "$(cut -d' ' -f1 SHA256SUMS)" release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="${{ steps.version.outputs.notes }}"
          assets=(
            "starx-universal-$version.jar"
            SHA256SUMS
            release-manifest.json
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME"               --notes-file "$notes"               --title "StarX $version"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}"               --verify-tag               --notes-file "$notes"               --title "StarX $version"
          fi

      - name: Upload release verification evidence
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            starx-universal-${{ steps.version.outputs.version }}.jar
            SHA256SUMS
            release-manifest.json
            docs/releases/${{ steps.version.outputs.version }}.md

  deploy-six-servers:
    name: Deploy to ${{ matrix.name }}
    needs: release
    runs-on: [self-hosted, linux, x64, starx-deploy]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: velocity
            path: /data/minecraft/vc/plugins/starx-universal.jar
          - name: lobby
            path: /data/minecraft/lobby/plugins/starx-universal.jar
          - name: le
            path: /data/minecraft/le/plugins/starx-universal.jar
          - name: pvp
            path: /data/minecraft/pvp/pvp/plugins/starx-universal.jar
          - name: thepit
            path: /data/minecraft/thepit/plugins/starx-universal.jar
          - name: chasergamer
            path: /data/minecraft/ChaserGamer#4/plugins/starx-universal.jar

    steps:
      - name: Download and verify release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          path: .release

      - name: Verify release artifact checksum
        run: |
          set -euo pipefail
          (cd .release && sha256sum -c SHA256SUMS)
          jar=(.release/starx-universal-*.jar)
          test "${#jar[@]}" -eq 1
          echo "JAR=${jar[0]}" >> "$GITHUB_ENV"

      - name: Backup, atomically install, and verify ${{ matrix.name }}
        env:
          SUDO_PASS: ${{ secrets.STARX_DEPLOY_SUDO_PASSWORD }}
          TARGET: ${{ matrix.path }}
        run: |
          set -euo pipefail
          test -n "$SUDO_PASS"
          expected="$(sha256sum "$JAR" | cut -d' ' -f1)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          root_script=$(cat <<EOF
          set -euo pipefail
          target='$TARGET'
          jar='$GITHUB_WORKSPACE/$JAR'
          expected='$expected'
          test -f "\$target"
          test "\$(sha256sum "\$jar" | cut -d' ' -f1)" = "\$expected"
          cp -a -- "\$target" "\${target}.bak.${stamp}"
          install -m 644 "\$jar" "\${target}.new"
          test "\$(sha256sum "\${target}.new" | cut -d' ' -f1)" = "\$expected"
          mv -f -- "\${target}.new" "\$target"
          test "\$(sha256sum "\$target" | cut -d' ' -f1)" = "\$expected"
          printf '%s ' "\$target"
          stat -c '%s bytes' "\$target"
          sha256sum "\$target"
          EOF
          )
          printf '%s\n' "$SUDO_PASS" | sudo -S -p '' bash -c "$root_script"
