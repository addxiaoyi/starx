name: Deploy StarX to six servers

'on':
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: starx-six-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, starx-deploy]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: velocity
            path: /data/minecraft/vc/plugins/starx-universal.jar
          - name: lobby
            path: /data/minecraft/lobby/plugins/starx-universal.jar
          - name: le
            path: /data/minecraft/le/plugins/starx-universal.jar
          - name: pvp
            path: /data/minecraft/pvp/pvp/plugins/starx-universal.jar
          - name: thepit
            path: /data/minecraft/thepit/plugins/starx-universal.jar
          - name: chasergamer
            path: /data/minecraft/ChaserGamer#4/plugins/starx-universal.jar

    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${MANUAL_TAG:-$WORKFLOW_TAG}"
          [[ "$tag" == v* ]] || { echo "Invalid release tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir -p .release
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}"             --pattern "starx-universal-*.jar" --dir .release
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}"             --pattern SHA256SUMS --dir .release
          jar=(.release/starx-universal-*.jar)
          [[ ${#jar[@]} -eq 1 ]] || { echo "Expected exactly one release JAR" >&2; exit 1; }
          (cd .release && sha256sum -c SHA256SUMS)
          echo "JAR=${jar[0]}" >> "$GITHUB_ENV"

      - name: Backup, verify, and atomically install ${{ matrix.name }}
        env:
          SUDO_PASS: ${{ secrets.STARX_DEPLOY_SUDO_PASSWORD }}
          TARGET: ${{ matrix.path }}
        run: |
          set -euo pipefail
          [[ -n "$SUDO_PASS" ]] || { echo "STARX_DEPLOY_SUDO_PASSWORD is not configured" >&2; exit 1; }
          [[ "$TARGET" == /data/minecraft/*/plugins/starx-universal.jar || "$TARGET" == /data/minecraft/*/*/plugins/starx-universal.jar ]] || { echo "Unsafe target" >&2; exit 1; }
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          jar_path="$GITHUB_WORKSPACE/$JAR"
          expected="$(sha256sum "$jar_path" | cut -d' ' -f1)"
          root_script=$(cat <<EOF
          set -euo pipefail
          target='$TARGET'
          jar_path='$jar_path'
          expected='$expected'
          backup="\${target}.bak.${stamp}"
          test -f "\$target"
          test -s "\$jar_path"
          test "\$(sha256sum "\$jar_path" | cut -d' ' -f1)" = "\$expected"
          cp -a -- "\$target" "\$backup"
          install -m 644 "\$jar_path" "\${target}.new"
          test "\$(sha256sum "\${target}.new" | cut -d' ' -f1)" = "\$expected"
          mv -f -- "\${target}.new" "\$target"
          test "\$(sha256sum "\$target" | cut -d' ' -f1)" = "\$expected"
          printf '%s ' "\$target"
          stat -c '%s bytes' "\$target"
          sha256sum "\$target"
          EOF
          )
          printf '%s
' "$SUDO_PASS" | sudo -S -p '' bash -c "$root_script"
