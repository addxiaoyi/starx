name: Plugin CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify universal plugin
        run: |
          chmod +x gradlew
          ./gradlew clean \
            :starx-plugins:starx-universal:check \
            --console=plain
      - name: Upload universal plugin
        uses: actions/upload-artifact@v6
        with:
          name: starx-universal
          if-no-files-found: error
          path: starx-plugins/starx-universal/build/libs/starx-universal.jar
