name: Plugin CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify plugin release
        run: |
          chmod +x gradlew
          ./gradlew clean test \
            :starx-plugins:starx-api:build \
            :starx-plugins:starx-extension-example:build \
            :starx-plugins:starx-universal:check \
            --console=plain
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starx-plugin-build
          if-no-files-found: error
          path: |
            starx-plugins/starx-universal/build/libs/starx-universal.jar
            starx-plugins/starx-velocity/build/libs/starx-velocity.jar
            starx-plugins/starx-server/build/libs/starx-server.jar
            starx-plugins/starx-api/build/libs/*.jar
            starx-plugins/starx-extension-example/build/libs/starx-extension-example.jar
