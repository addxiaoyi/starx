name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify build toolchain matches release requirements
        if: runner.os != 'Windows'
        shell: bash
        run: |
          java -version 2>&1 | grep '"25' || { echo "ERROR: CI must run on JDK 25"; exit 1; }
          echo "Build toolchain OK (JDK 25)"

      - name: Verify all modules and universal plugin
        if: runner.os != 'Windows'
        run: |
          chmod +x gradlew
          ./gradlew clean check :starx-plugins:starx-universal:check --warning-mode all --no-daemon --console=plain --non-interactive

      - name: Verify all modules and universal plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat clean check `
            :starx-plugins:starx-universal:check `
            --warning-mode all `
            --no-daemon `
            --console=plain `
            --non-interactive

      - name: Upload JUnit XML
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 3
          path: "**/build/test-results/test/*.xml"

      - name: Upload universal plugin
        if: runner.os == 'Linux' && success()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: starx-universal
          if-no-files-found: error
          retention-days: 3
          path: starx-plugins/starx-universal/build/libs/starx-universal.jar
