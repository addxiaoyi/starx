# Serve backend-managed avatar and texture uploads from the same public origin.
location ^~ /uploads/ {
    alias /www/wwwroot/starmc-api/data/uploads/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
}
